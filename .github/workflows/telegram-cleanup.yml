name: Telegram cleanup (expired bot messages)

# Every 2 minutes. Deletes bot-posted messages whose delete_after has
# passed (10-min welcome fallbacks, meet-posts past their lifespan, ops
# alerts) and kicks any user who never DM'd the bot from the main group.
# Nag rotation deletes are handled inline by telegram_broadcast, not here.

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
    inputs:
      dry: { description: 'Dry-run only', required: false, default: 'false' }

concurrency:
  group: telegram-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cleanup expired bot messages
        env:
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node scripts/telegram_cleanup.mjs $ARGS
