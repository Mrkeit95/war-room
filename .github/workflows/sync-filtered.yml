name: Sync follow-up filter (Typeform → FILTERED EXP)

# Runs every 15 min. Pulls responses from the "Experienced chatter- Filtering"
# Typeform (KnkH7pY6) and moves matching applicants from APPLICANTS (C) Exp
# (or EXP TYPEFORMS (O + C)) → FILTERED (EXP) with the full follow-up Q&A
# posted as an Update.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: filtered-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run filter sync
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID_PH: ${{ secrets.MONDAY_BOARD_ID_PH }}
          TYPEFORM_TOKEN: ${{ secrets.TYPEFORM_TOKEN }}
        run: |
          echo "Syncing follow-up filter at $(date -u)"
          node scripts/sync_filtered.mjs
